<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Користувачі</title>
</head>
<body>
<h1>Список користувачів</h1>

<ul>
    <li th:each="user : ${users}">
        <span th:text="${user.name}">Ім'я</span> -
        <span th:text="${user.email}">email@example.com</span>
        <form th:action="@{/delete}" method="post" style="display:inline">
            <input type="hidden" name="id" th:value="${user.id}" />
            <button type="submit">Видалити</button>
        </form>
    </li>
</ul>

<h2>Додати нового користувача</h2>
<form th:action="@{/add}" th:object="${newUser}" method="post">
    <input type="text" th:field="*{name}" placeholder="Ім’я" required /><br/>
    <input type="email" th:field="*{email}" placeholder="Email" required /><br/>
    <button type="submit">Додати</button>
</form>
</body>
</html>
